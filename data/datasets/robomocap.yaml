notes: >-
  Released on BitRobot's Hugging Face by Jiafei Duan with GroundedSI and NOKOV. Each session pairs a 53-marker NOKOV optical capture at 120 Hz with
  six head-mounted and two wrist-mounted RoboCap / RoboWrist cameras (plus IMU, magnetometer and audio), a third-person
  video, tracked objects with textured scans, and a SMPL-X solve of the markers (a few mm of marker error) whose hands
  come from the egocentric cameras. 294 scripted actions in eight groups: locomotion primitives, posture dynamics,
  static and loco-manipulation, environment-coupled whole-body moves, dynamic recovery (catching a fall), long
  composite tasks and two-person loco-manipulation, each with a written instruction. The motion files are a small part
  of the 5 TB release, which is mostly video.
