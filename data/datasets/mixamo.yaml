notes: >-
  Online library of humanoid animations, created with motion capture and polished by keyframe animators, that can be
  applied to Mixamo's auto-rigged characters and downloaded free with an Adobe ID. Adobe's FAQ allows royalty-free
  personal and commercial use in projects; an Adobe community FAQ states that the raw files may not be redistributed
  and may not be used to train machine-learning models.
