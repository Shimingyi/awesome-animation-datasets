  download: https://huggingface.co/datasets/H-Liu1997/BEAT
  code: https://github.com/PantoMatrix/BEAT
  paper: https://arxiv.org/abs/2203.05297
paper:
  title: 'BEAT: A Large-Scale Semantic and Emotional Multi-Modal Dataset for Conversational Gestures Synthesis'
  venue: ECCV 2022
citation: |
  @article{liu2022beat,
    title   = {BEAT: A Large-Scale Semantic and Emotional Multi-Modal Dataset for Conversational Gestures Synthesis},
    author  = {Haiyang Liu, Zihao Zhu, Naoya Iwamoto, Yichen Peng, Zhengqing Li, You Zhou, Elif Bozkurt, Bo Zheng},
    journal = {European Conference on Computer Vision},
    year    = {2022}
  }
variants:
  - name: BEAT2 (BEATX)
    url: https://huggingface.co/datasets/H-Liu1997/BEAT2
