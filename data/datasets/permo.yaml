notes: >-
  Short clips of ten actions, each acted in 34 styles grouped as age, character (zombie, robot, ninja, ...),
  condition, emotion, traits and surroundings, by five actors so every style exists as five personas. Ships C3D markers,
  BVH, SMPL-H parameters, rendered videos and 20 to 30 text descriptions per action.
