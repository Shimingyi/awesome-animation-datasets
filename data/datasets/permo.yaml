  8.5 h by our count of the BVH release; 6,610 clips (README and paper) by 5 professional actors (2 women, 3 men), each performing 34 styles, i.e. 170
  personas; captured at 120 fps with 33 OptiTrack cameras. The release does not state a total duration.
