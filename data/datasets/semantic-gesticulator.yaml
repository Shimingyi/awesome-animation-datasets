notes: >-
  Short mocap clips of commonly used semantic (iconic and emblematic) gestures, each performed in about 2.6 variations,
  with an index of label, description, contextual meaning and example sentence per gesture (SeG_list.xlsx). The
  co-speech model of the paper is trained on ZEGGS and BEAT; this set is the retrieval library.
