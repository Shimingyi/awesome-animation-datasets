notes: >-
  Unifies many optical marker-based mocap datasets (CMU, KIT, BMLrub, HDM05, ACCAD and others) by fitting SMPL-H, and
  since 2022 SMPL-X, bodies to the original markers with MoSh++. It is the motion source of HumanML3D and many other
  text-to-motion datasets.
