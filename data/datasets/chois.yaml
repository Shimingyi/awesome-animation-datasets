notes: >-
  The release is a re-processed copy of the OMOMO full-body manipulation mocap (Li et al., SIGGRAPH Asia 2023; not
  listed here separately) packaged with CHOIS's text descriptions, hand contact labels and object geometry, in joblib
  pickles of SMPL-X parameters and object poses. It is meant for generating synchronized human and object motion from
  language and sparse object waypoints.
