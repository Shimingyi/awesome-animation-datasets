paper:
  title: Controllable Human-Object Interaction Synthesis
  venue: ECCV 2024
citation: |
  @inproceedings{li2023controllable,
    title={Controllable human-object interaction synthesis},
    author={Li, Jiaman and Clegg, Alexander and Mottaghi, Roozbeh and Wu, Jiajun and Puig, Xavier and Liu, C. Karen},
    booktitle={ECCV},
