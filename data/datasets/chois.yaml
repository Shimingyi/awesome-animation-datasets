id: chois
name: CHOIS
full_name: Controllable Human-Object Interaction Synthesis
good_for: "Text- and waypoint-conditioned human-object interaction (carrying, pushing, pulling furniture and boxes) on SMPL-X."
year: 2024
released: 2024-09
subject: human-body
content: daily-activity
content_note: "not broken down; every sequence is a person moving, lifting, pushing or pulling one of 15 large objects"
tags: [object-manipulation, daily-activity, locomotion, text-annotated]
capture: optical-mocap
representation: [smplx]
skeleton:
  rig: SMPL-X (body pose, 16 shape coefficients) with per-frame object pose
stats:
  hours: 10
  subjects: 17
stats_note: >-
  Numbers of the underlying OMOMO (FullBodyManipulation) capture as given in the CHOIS paper: 10 h of paired human and
  object motion with 15 objects, 15 training and 2 test subjects. CHOIS leaves out the articulated vacuum and mop
  sequences when training.
annotations: [text, contacts, object-trajectories]
