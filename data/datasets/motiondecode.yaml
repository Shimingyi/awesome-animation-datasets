id: motiondecode
name: MotionDecode
full_name: ChingMu MotionDecode 1000-Hour Embodied Motion Dataset (Unitree G1 release)
good_for: "Nearly 1,000 h of optical mocap retargeted to the Unitree G1, in 480 labelled everyday, work, social and sports tasks: humanoid imitation learning."
year: 2026
released: 2026-06
subject: robot
content:
  daily-activity: 0.577
  gesture: 0.158
  locomotion: 0.088
  interaction: 0.082
  sports: 0.049
  dance: 0.041
  combat: 0.005
content_note: >-
  our count of the hours per folder of the release taxonomy: daily life, household, occupational, assistive and
  object-handling tasks as daily-activity; emotional expression and greetings as gesture; gait, crawling, stairs and
  terrain as locomotion; object passing and cooperative carrying or moving as interaction; jumps, throws, balance,
  parkour and ball games as sports; boxing, fencing and martial arts as combat
tags: [daily-activity, object-manipulation, gesture, emotion, interaction, locomotion, crawling, sitting, sports,
       acrobatics, dance, combat, retargeted]
capture: optical-mocap
representation: [csv]
skeleton:
  joints: 29
  rig: Unitree G1 (29 DoF), root position (m, Z-up) and quaternion (wxyz) plus joint angles (rad) in URDF order
fps: 120
stats:
  hours: 973
  clips: 91198
stats_note: >-
  our count of the full Hugging Face release (September 2026): 92,560 G1 CSVs (138 GB on disk) under the 480 task
  labels of metadata/index.csv, of which 1,362 are byte-identical copies of other files; the remaining 91,198 takes
  hold 420,336,456 frames, 973.0 h at 120 fps. Official: "1000+ hours @ 120 Hz" of optical mocap, 15+ scenarios, 500+ tasks, 200+ tracked objects; the
  number of performers is not given. The card also lists BVH, object 6D pose, video and NPZ, but only the retargeted
  G1 CSVs are released.
annotations: [action-labels]
license:
  name: ChingMu Dataset Access Terms (non-commercial)
  url: https://huggingface.co/datasets/CMRobot/MotionDecode/blob/main/LICENSE.md
  commercial: false
access: open
links:
  homepage: https://chingmudata.github.io/MotionDecode/
  download: https://huggingface.co/datasets/CMRobot/MotionDecode
review:
  verdict: usable
  issues: [penetration, retarget-artifacts]
  note: >-
    Foot contact is as steady as the Unitree LAFAN1 retarget, but the feet sit about 2 cm below z = 0 throughout. The
    pop-dance part (5.Dance, about 11 h) has frequent single-frame flips of the shoulder pitch and yaw angles; the other
    folders rarely do.
  date: 2026-10-19
notes: >-
  Optical motion capture by ChingMu (a Chinese mocap-system maker), released as Unitree G1 trajectories only: one CSV
  per take with the root pose and the 29 joint angles at 120 fps, filed in a four-level folder taxonomy (basic movement,
  gait, daily life, occupational and assistive tasks, social interaction, emotional expression, dance, parkour, ball
  games, combat). The partner of a two-person task is not released, and the release adds no text descriptions.
