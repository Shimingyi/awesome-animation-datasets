notes: >-
  Captured by Meta's Codec Avatars Lab on an 80-camera stage (64 body and 16 face cameras) without markers: Sapiens
  keypoints are triangulated and solved to SMPL-X body, hand and shape parameters, with a per-frame flag for corrupted
  tracking. Seven sections (Charades, Hand Interactions, Locomotion, Dyadic and Multi-Person Conversations, Scenarios,
  Day in the Life) cover prompted actions, hand gestures, conversations in different emotional states, collaborative
  tasks and co-living in an apartment set, with speaker-separated audio, a bird's-eye video and, for some sections, text
  descriptions per 10 s. Download links are sent after accepting the licence on the Meta page.
