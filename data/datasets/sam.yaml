notes: >-
  Vicon mocap of people reacting to sounds played from loudspeakers around them, recorded with binaural microphones at
  the ears and annotated with the sound-source location; the release ships raw BVH and C3D, retargeted BVH, MOSPA-ready
  NPZ and stereo audio (one 25 GB archive). The card flags noisy source annotations and an ignore list.
