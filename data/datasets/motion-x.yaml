  commercial: false
access: gated
links:
  homepage: https://motion-x-dataset.github.io
  code: https://github.com/IDEA-Research/Motion-X
  paper: https://arxiv.org/abs/2307.00818
paper:
  title: 'Motion-X: A Large-scale 3D Expressive Whole-body Human Motion Dataset'
  venue: NeurIPS 2023
citation: |
  @article{lin2023motionx,
    title={Motion-X: A Large-scale 3D Expressive Whole-body Human Motion Dataset},
    author={Lin, Jing and Zeng, Ailing and Lu, Shunlin and Cai, Yuanhao and Zhang, Ruimao and Wang, Haoqian and Zhang, Lei},
    journal={Advances in Neural Information Processing Systems},
    year={2023}
  }
variants:
  - name: Motion-X++
    url: https://huggingface.co/datasets/YuhongZhang/Motion-Xplusplus
    note: >-
      extended re-release (120.5K sequences, 19.5M poses) with re-annotated SMPL-X, video, audio and text
      (arXiv:2501.05098)
notes: >-
  Whole-body SMPL-X motion (body, hands, face) with sequence- and frame-level text, unified from online videos, the
  self-recorded IDEA400 set and eight existing datasets. The AMASS, GRAB and EgoBody motion is not redistributed and
  must be obtained from those datasets; Motion-X provides text and face labels for them.
review:
  verdict: caution
  issues: [jitter, foot-skating, penetration]
  note: >-
    Most of the motion is reconstructed from monocular video: strong jitter, foot skating and ground / self
    penetration across the examples we inspected.
  date: 2026-10-19
