id: motion-x
name: Motion-X
full_name: 'Motion-X: A Large-scale 3D Expressive Whole-body Human Motion Dataset'
good_for: "Very large whole-body SMPL-X with text, mostly from video: coverage over quality."
year: 2023
released: 2023-07
subject: human-body
