tags: [daily-activity, dance, sports, martial-arts, text-annotated, action-labels]
capture: mixed
representation: [smplx]
skeleton:
  joints: 55
  rig: SMPL-X
fps: 30
stats:
  hours: 144.2
  clips: 81084
stats_note: >-
  81,084 sequences, 144.2 h and 15.6M whole-body poses at 30 fps (official, Table 1 of the paper). The data distributed by
  the authors, without the AMASS, GRAB and EgoBody subsets, is 52,464 clips (86.7 h) in the BVH release used by
  DATA.md
annotations: [text, pose-text, facial-expression]
