notes: >-
  LLM-scripted interaction scenes performed in Rokoko inertial suits and gloves, with object poses tracked from two
  RGB-D cameras; professional artists cleaned every sequence to reduce foot sliding and penetration. Motion is retargeted
  to a Mixamo-compatible character and ships as FBX/GLB scenes with object meshes and three levels of text per
  sequence. A 10% subset is open on GitHub; the full set is licensed per institution by Adobe.
