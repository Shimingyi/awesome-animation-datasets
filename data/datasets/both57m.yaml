notes: >-
  Body and two-hand motion solved as SMPL-H from a 32-camera markerless capture (ViTPose body and MediaPipe hand
  keypoints), with separate body and finger-level hand descriptions by human annotators. Access needs a licence form
  signed by a supervisor; the archive is password protected.
review:
  verdict: caution
  issues: [root-drift, jitter]
  note: >-
    Reconstructed from markerless multi-view video: the feet float above the floor and the motion jitters (our red
    flags: floating in 70% and jitter in 62% of windows, plus physics).
  date: 2026-10-20
