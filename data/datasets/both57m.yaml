id: both57m
name: BOTH57M
full_name: 'BOTH57M: body and two-hand motion with text (BOTH2Hands)'
good_for: "Two-hand motion with finger-level text, on a moving body: hand generation from text and body dynamics."
year: 2023
released: 2023-12
subject: human-body
