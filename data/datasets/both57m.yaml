stats:
  hours: 4.23
  clips: 3229
stats_note: >-
  Counted from the release (python -m tools.examples.both57m): 3,229 clips of up to 5 s, 4.23 h at 30 fps, all with
  whole-body text and 1,815 with hand text. The paper reports 8.31 h in 1,384 sequences; the 57.4M
  frames of the name count all 32 camera views.
annotations: [text, video]
