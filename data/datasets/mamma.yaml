stats_note: >-
  hours are ours, motion per person summed over the released SMPL-X predictions: dance 1.87 h (210 person tracks),
  multi-people 0.60 h (143), iPhone 0.23 h (55), plus the evaluation ground truth 0.41 h (62 person tracks, MoSh fits
  to optical markers); 9 dance / multi-people sequences have no prediction file. Official minutes per sequence (one take counted once): 123 dance
  sequences (67 min), 34 multi-people (8 min), 42 iPhone (10 min), 52 evaluation (24 min), all at 30 fps. The
  synthetic training set MammaSyn (about 333 min of renders at 6 fps, 8 views) is listed as a variant.
