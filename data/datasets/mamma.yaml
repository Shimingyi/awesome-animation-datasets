notes: >-
  SMPL-X bodies (with hands) recovered by the MAMMA markerless pipeline from 32 synchronised IOI cameras (4 iPhones for
  the iPhone captures): partner dances with close contact, groups of 3-6 people, and evaluation sequences. Per sequence
  the release has per-person SMPL-X parameters, camera calibration and the multi-view videos; registration at the
  homepage is needed to download.
