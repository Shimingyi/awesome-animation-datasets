content_note: >-
  from the release's minutes per part: markerless dance 67 min (West Coast Swing, Bachata, Breakdance, Ballroom),
  multi-people 8 min (3-6 people), iPhone captures 10 min and evaluation sequences 24 min (singles, dance, extra);
  the synthetic MammaSyn renders are not counted
