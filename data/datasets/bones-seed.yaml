notes: >-
  Vicon-captured everyday, locomotion, communication, dance, gaming and sport motions with up to six text
  descriptions per motion, released on the NVIDIA SOMA body model and retargeted to the Unitree G1 humanoid. The
  licence covers academic non-commercial research and startups under USD 1M annual revenue, and forbids
  redistribution.
