id: bones-seed
name: BONES-SEED
full_name: 'BONES-SEED: Skeletal Everyday Embodiment Dataset'
good_for: "Huge, varied and clean everyday motion from 500+ performers: pretraining and motion matching."
year: 2026
released: 2026-03
subject: human-body
content:
  locomotion: 0.47
  daily-activity: 0.25
  dance: 0.13
  gesture: 0.11
