id: interhuman
name: InterHuman
full_name: InterHuman two-person interaction dataset (InterGen)
good_for: "Text-to-two-person interaction: daily interactions plus fighting, dance and sports duets."
year: 2023
released: 2023-04
subject: human-body
content: interaction
content_note: "two-person daily interactions plus professional ones (Taekwondo, Latin dance, boxing ...); not broken down by duration"
tags: [interaction, daily-activity, martial-arts, combat, dance, text-annotated]
capture: video
representation: [smpl, joints]
skeleton:
  joints: 22
  rig: SMPL (22-joint AMASS-style kinematic tree in the processed data)
fps: 30
stats:
  hours: 20.9
  clips: 7777
  subjects: 60
stats_note: >-
  our count of the processed release, both people counted: 7,777 two-person clips (ids 1-7779, two missing), 10.47 h per
  take at 30 fps, 20.9 h of motion per person (raw motions
  at 59.94 fps); the paper states 7,779 sequences and 6.56 h, by 30 pairs of performers, with 23,337 descriptions
  (three per clip); reconstructed from 76 synchronised RGB cameras without markers
annotations: [text]
