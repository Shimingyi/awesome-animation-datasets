notes: >-
  Two-person interactions captured on a 76-camera markerless stage and solved to SMPL; released as raw per-person
  motion "standardised as SMPL, similar to AMASS" plus processed joint positions and 6D rotations, with clips of
  mostly a few seconds (median 2.3 s, a few over a minute) and three crowd-sourced descriptions each.
