annotations: [text, age, body-characteristics, style, emotion, environment]
license:
  name: CC BY-NC-SA 4.0 (MotionMillion community licence, gated)
  url: https://creativecommons.org/licenses/by-nc-sa/4.0/
  commercial: false
access: gated
links:
  homepage: https://huggingface.co/datasets/InternRobotics/MotionMillion
  download: https://huggingface.co/datasets/InternRobotics/MotionMillion
review:
  verdict: caution
  issues: [foot-skating, unnatural-pose]
  note: >-
    Reconstructed from web video (video mocap): foot skating and motion that does not look physically real in the
    examples we inspected.
  date: 2026-10-19
notes: >-
  Motion recovered from web video (the card says over 2000 hours), plus several existing sets re-processed into one 272-dim
  representation (root velocity and heading, 22 joint positions, velocities and 6D rotations), each motion with 20+
  annotations (age, body, style, emotion, environment).
