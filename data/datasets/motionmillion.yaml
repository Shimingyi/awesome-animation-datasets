id: motionmillion
name: MotionMillion
good_for: "Very large text-annotated motion corpus for zero-shot text-to-motion; quality varies (video mocap)."
year: 2025
released: 2025-07
subject: human-body
content:
  sports: 0.29
  combat: 0.24
  dance: 0.15
  general: 0.32
